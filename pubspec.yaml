name: trilateration_app
description: "App xác định tọa độ điểm B bằng hình học Trilateration."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # --- CÁC THƯ VIỆN CHÍNH ---
  geolocator: ^10.1.0        
  flutter_map: ^6.1.0        
  latlong2: ^0.9.1           
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2 
  url_launcher: ^6.3.2
  http: ^1.1.0

  # --- BỘ THƯ VIỆN CACHE (ĐÃ CHỈNH VERSION ĐỂ KHỚP NHAU) ---
  flutter_map_cache: ^1.5.2  
  dio: ^5.3.0                
  dio_cache_interceptor: ^3.5.1 
  # 👇 Đã hạ xuống 1.2.3 theo yêu cầu của Flutter 👇
  dio_cache_interceptor_file_store: ^1.2.3
  path_provider: ^2.1.5      

  # --- KHÁC ---
  rename: ^3.1.0
  flutter_overlay_window: ^0.5.0
  installed_apps: ^1.0.1

  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  android_id: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"