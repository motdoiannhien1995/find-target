name: trilateration_app
description: "App xác định tọa độ điểm B bằng hình học Trilateration."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Thư viện lấy tọa độ GPS
  geolocator: ^10.1.0
  # Thư viện hiển thị bản đồ OpenStreetMap
  flutter_map: ^6.1.0
  # Thư viện xử lý kiểu dữ liệu LatLng
  latlong2: ^0.9.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.2
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true